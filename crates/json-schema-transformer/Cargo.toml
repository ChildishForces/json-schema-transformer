[package]
name = "json-schema-transformer"
version = "0.1.0"
edition = "2024"
description = "Transform JSON Schema into native types and validation schemas for multiple languages"

[features]
default = []
all-emitters = ["zod", "typescript", "pydantic", "swift", "kotlin"]
zod = []
typescript = []
pydantic = []
swift = []
kotlin = []

[dependencies]
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
