[package]
name = "jst-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for json-schema-transformer: convert JSON Schema to Zod, TypeScript, Pydantic, Swift, and Kotlin"

[[bin]]
name = "jst"
path = "src/main.rs"

[dependencies]
json-schema-transformer = { path = "../json-schema-transformer", version = "0.1.0", features = ["all-emitters"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
