[package]
name = "conformance-gen"
version = "0.1.0"
edition = "2024"
description = "Generates per-language conformance fixtures from the JSON Schema Test Suite"
publish = false

[[bin]]
name = "conformance-gen"
path = "src/main.rs"

[dependencies]
json-schema-transformer = { path = "../json-schema-transformer", features = ["all-emitters"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
