name: Grammar
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  harper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ChildishForces/harper-github-action@v1
        with:
          allowlist: |
            docs/**/*.md
            README.md
          dialect: british