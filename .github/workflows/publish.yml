# Publishes json-schema-transformer to crates.io when a version tag (v*) is
# pushed. The tag must match the workspace version in Cargo.toml.
#
# Auth is via crates.io Trusted Publishing (OIDC) — the crate's settings on
# crates.io must list this repo + workflow filename as a trusted publisher.
# No long-lived token is stored in the repo.
#
# jst-cli is intentionally not published to crates.io; the CLI is distributed
# via Homebrew and similar package managers.

name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "json-schema-transformer") | .version')"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match json-schema-transformer version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --all-features

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish -p json-schema-transformer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
